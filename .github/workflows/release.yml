name: Build and release GitSwamp

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: gitswamp-release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        working-directory: software/gitswamp
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const base = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const match = base.match(/^(\d+)\.(\d+)\.(\d+)/);
          if (!match) throw new Error(`Expected a stable semver version, received ${base}.`);

          const [, major, minor, patch] = match;
          const releasePatch = Number(patch) * 1_000_000 + Number(process.env.RUN_NUMBER);
          const version = `${major}.${minor}.${releasePatch}`;
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=v${version}\n`);
          NODE

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            artifact: windows-x86_64
            tauri_args: ""
          - name: Linux x64
            runner: ubuntu-24.04
            artifact: linux-x86_64
            tauri_args: ""
          - name: macOS Intel
            runner: macos-15-intel
            artifact: darwin-x86_64
            tauri_args: --target x86_64-apple-darwin
          - name: macOS Apple Silicon
            runner: macos-14
            artifact: darwin-aarch64
            tauri_args: --target aarch64-apple-darwin
    defaults:
      run:
        working-directory: software/gitswamp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: software/gitswamp/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is required to build signed updater artifacts." >&2
            exit 1
          }

      - name: Set this build's release version
        run: node scripts/set-release-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Build signed Tauri bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build ${{ matrix.tauri_args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: software/gitswamp/src-tauri/target/**/release/bundle/**

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Set release version for the manifest
        working-directory: software/gitswamp
        run: node scripts/set-release-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Collect updater artifacts and write latest.json
        working-directory: software/gitswamp
        env:
          GITSWAMP_REPO: ${{ github.repository }}
        run: |
          node scripts/collect-release-assets.mjs ../../release-artifacts release-files
          node scripts/generate-update-manifest.mjs --tag "${{ needs.prepare.outputs.tag }}" --version "${{ needs.prepare.outputs.version }}" --bundle-dir release-files --out release-files/latest.json --notes "Automated build for ${{ github.sha }}"

      - name: Publish signed release and updater manifest
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GitSwamp ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: software/gitswamp/release-files/*
